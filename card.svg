<text x="20" y="454" font-size="11" font-weight="400" text-anchor="start" fill="#000"></text>
<text x="20" y="468" font-size="11" font-weight="400" text-anchor="start" fill="#000">Contains: CSS, TypeScript, JavaScript, PHP, PowerShell, Python.</text>
<text x="20" y="482" font-size="11" font-weight="400" text-anchor="start" fill="#000">May contain traces of ffmpeg.</text>
