<text x="20" y="412" font-size="11" font-weight="400" text-anchor="start" fill="#000">* Percent Daily Value is based on a 2,000 commit diet.</text>
<text x="20" y="426" font-size="11" font-weight="400" text-anchor="start" fill="#000">Your values may vary depending on how many side</text>
