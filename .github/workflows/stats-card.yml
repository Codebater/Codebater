name: Rebuild stats card

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/stats-card.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The default GITHUB_TOKEN only sees public data, which would silently
      # report 0 private repositories and make the card lie. Skip instead.
      - name: Check for a token that can see private repo counts
        id: gate
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::notice::STATS_TOKEN secret not set - leaving card.svg untouched."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build card
        if: steps.gate.outputs.ok == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
          CARD_LOGIN: ${{ github.repository_owner }}
        run: |
          node scripts/build-card.mjs
          node scripts/build-discord-card.mjs

      - name: Commit if changed
        if: steps.gate.outputs.ok == 'true'
        run: |
          if git diff --quiet -- card.svg card-discord.svg; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card.svg card-discord.svg
          git commit -m "Refresh stats card"
          git push
